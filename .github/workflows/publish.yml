name: publish
on: push
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  pages: write
  id-token: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Install Graphviz
        run: |
          sudo apt-get update
          sudo apt-get install graphviz
      - name: Install Doxygen
        run: |
          DOXYGEN_VERSION="1.16.1"
          wget -q "https://github.com/doxygen/doxygen/releases/download/Release_$(echo $DOXYGEN_VERSION | tr '.' '_')/doxygen-${DOXYGEN_VERSION}.linux.bin.tar.gz"
          tar -xzf doxygen-${DOXYGEN_VERSION}.linux.bin.tar.gz
          sudo mv doxygen-${DOXYGEN_VERSION}/bin/doxygen /usr/local/bin/doxygen
          rm -rf doxygen-${DOXYGEN_VERSION}*
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Build
        run: |
          cmake -S . -B build && cmake --build build --target doc
      - name: Touch .nojekyll
        run: |
          touch build/doc/html/.nojekyll
      - id: artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: build/doc/html
  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.artifact.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
