name: build
on:
  workflow_dispatch:
    inputs:
      buildType: # https://cmake.org/cmake/help/latest/variable/CMAKE_CONFIGURATION_TYPES.html
        description: 'CMake build type'
        type: choice
        options:
          - Debug
          - RelWithDebInfo
          - Release
          - MinSizeRel
        required: true
        default: RelWithDebInfo
      buildSharedLibs: # https://cmake.org/cmake/help/latest/variable/BUILD_SHARED_LIBS.html
        description: 'Build dynamic library'
        type: boolean
        default: true
      buildExamples:
        description: 'Build example applications'
        type: boolean
        default: false
      buildTesting: # https://cmake.org/cmake/help/latest/variable/BUILD_TESTING.html
        description: 'Run tests'
        type: boolean
        default: true
      cmakeArgs:
        description: 'Additional CMake arguments'
  push:
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86
            os: ubuntu-24.04
            install_dir: ~/portSMF
            cmake_extras: -DCMAKE_BUILD_TYPE=${{ inputs.buildType || 'RelWithDebInfo' }}
            ctest_target: test
          - name: linux-arm
            os: ubuntu-24.04-arm
            install_dir: ~/portSMF
            cmake_extras: -DCMAKE_BUILD_TYPE=${{ inputs.buildType || 'RelWithDebInfo' }}
            ctest_target: test
          - name: macos-x86
            os: macos-15-intel
            install_dir: ~/portSMF
            cmake_extras: -DCMAKE_BUILD_TYPE=${{ inputs.buildType || 'RelWithDebInfo' }}
            ctest_target: test
          - name: macos-arm
            os: macos-15
            install_dir: ~/portSMF
            cmake_extras: -DCMAKE_BUILD_TYPE=${{ inputs.buildType || 'RelWithDebInfo' }}
            ctest_target: test
          - name: windows-x86
            os: windows-2025
            install_dir: C:\portSMF
            cmake_config: --config ${{ inputs.buildType || 'RelWithDebInfo' }}
            ctest_target: RUN_TESTS
          - name: windows-arm
            os: windows-11-arm
            install_dir: C:\portSMF
            cmake_config: --config ${{ inputs.buildType || 'RelWithDebInfo' }}
            ctest_target: RUN_TESTS

    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    steps:
    - name: Check out Git repository
      uses: actions/checkout@v5
    - name: Configure
      run: cmake -DCMAKE_INSTALL_PREFIX=${{ matrix.install_dir }} ${{ matrix.cmake_extras }} ${{ inputs.cmakeArgs }} -DBUILD_TESTING=${{ !contains(inputs.buildTesting, 'false') }} -DBUILD_SHARED_LIBS=${{ !contains(inputs.buildSharedLibs, 'false') }} -DBUILD_APPS=${{ inputs.buildExamples }} -S . -B build
    - name: Build
      run: cmake --build build ${{ matrix.cmake_config }}
      env:
        CMAKE_BUILD_PARALLEL_LEVEL: 2
        CTEST_OUTPUT_ON_FAILURE: 1
    - name: Test
      if: ${{ !contains(inputs.buildTesting, 'false') }}
      run: cmake --build build --target ${{ matrix.ctest_target }} ${{ matrix.cmake_config }}
    - name: Install
      run: cmake --install . ${{ matrix.cmake_config }}
      working-directory: build
    - name: Upload Build Artifact
      uses: actions/upload-artifact@v5
      with:
        name: portsmf-${{ matrix.name }}
        path: ${{ matrix.install_dir }}
